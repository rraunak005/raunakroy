<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* Base styles applying the Algerian font */
        body {
            font-family: 'Algerian', serif; /* Falls back to standard serif if Algerian isn't installed */
            background-color: #ffffff;
            color: #1a1a1a;
            text-align: center;
            padding-top: 100px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Dark mode specific styles */
        body.dark-mode {
            background-color: #121212;
            color: #f1f1f1;
        }

        /* Styling for the social media link */
        a {
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
        }
        
        a:hover {
            text-decoration: underline;
        }

        /* Ensure link remains visible in dark mode */
        body.dark-mode a {
            color: #66b2ff;
        }

        /* Toggle button styling */
        button {
            font-family: 'Algerian', serif;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 30px;
            background-color: #e0e0e0;
            border: 1px solid #bcbcbc;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #cccccc;
        }

        /* Button styling for dark mode */
        body.dark-mode button {
            background-color: #333333;
            color: #ffffff;
            border-color: #555555;
        }
        
        body.dark-mode button:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>

    <h1>Welcome to my website</h1>
    
    <p>Contact me on social media: <a href="https://en.wikipedia.org" target="_blank">Wikipedia</a></p>

    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>

    <script>
        // JavaScript function to handle the dark mode toggle
        function toggleDarkMode() {
            // This adds or removes the 'dark-mode' class from the body tag
            document.body.classList.toggle('dark-mode');
        }
    </script>

</body>
</html>
